<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 页面走丢了 · 灯光市人民政府</title>
  <meta name="description" content="灯光市 - 您访问的页面不存在或已被移除。" />
  <meta name="robots" content="noindex" />
  <link rel="preload" href="css/style.min.css?v=20260907-v50-1" as="style" />
  <link rel="stylesheet" href="css/style.min.css?v=20260907-v50-1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2370ad34'/%3E%3Crect x='3' y='3' width='3' height='3' fill='%23ffd23f'/%3E%3Crect x='10' y='3' width='3' height='3' fill='%23ffd23f'/%3E%3Crect x='3' y='10' width='3' height='3' fill='%23ffd23f'/%3E%3C/svg%3E" />
</head>
<body>
<script src="js/theme.js?v=v48-5"></script>

  <!-- 像素天空背景 -->
  <div class="sky-bg" aria-hidden="true">
    <img src="assets/backgrounds/bg-pixel-hero.jpg" alt="" class="sky-bg-img" />
    <div class="sky-bg-overlay"></div>
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
    <div class="sun"></div>
  </div>

  <!-- 导航栏（简化版） -->
  <header class="navbar" id="navbar">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">
        <div class="logo-block" aria-hidden="true">
          <div class="block-grass"></div>
          <div class="block-dirt"></div>
        </div>
        <div class="logo-text">
          <span class="logo-zh">灯光市人民政府</span>
          <span class="logo-en">LIGHT CITY GOVERNMENT</span>
        </div>
      </a>
    </div>
  </header>

  <!-- 404 主内容 -->
  <main class="page-404" id="mainContent">
    <div class="not-found-wrap">

      <!-- 像素风格大数字 -->
      <div class="not-found-pixel" aria-hidden="true">
        <div class="pixel-digit pixel-4-1">▪️</div>
        <div class="pixel-digit pixel-0">▪️</div>
        <div class="pixel-digit pixel-4-2">▪️</div>
        <div class="pixel-digit pixel-4-3">▪️</div>
      </div>

      <!-- 标题 + 说明 -->
      <h1 class="not-found-title" id="nftTitle">页面走丢了</h1>
      <p class="not-found-sub" id="nftSub">
        您访问的页面在城市中走失了，可能是地址错误或已被移除。
      </p>

      <!-- 操作按钮 -->
      <div class="not-found-actions">
        <a href="index.html" class="btn btn-primary btn-lg" id="nftHome">
          返回首页
        </a>
        <a href="index.html#notice" class="btn btn-ghost btn-lg" id="nftNotice">
          查看公告
        </a>
      </div>

      <!-- 装饰：像素小路 -->
      <div class="not-found-path" aria-hidden="true">
        <div class="path-tile"></div><div class="path-tile"></div><div class="path-tile"></div>
        <div class="path-tile"></div><div class="path-tile"></div><div class="path-tile"></div>
        <div class="path-tile"></div><div class="path-tile"></div><div class="path-tile"></div>
      </div>

    </div>
  </main>

  <!-- i18n 翻译 -->
  <script type="module">
    import { t, setPageTitle, initI18n } from './js/i18n/core.js?v=n5';

    // v50-N6: 404 页面中英
    const titles = {
      'zh-CN': { title: '404 页面走丢了 · 灯光市人民政府', h1: '页面走丢了', sub: '您访问的页面在城市中走失了，可能是地址错误或已被移除。', home: '返回首页', notice: '查看公告' },
      'en':     { title: '404 Page Not Found · Light City Hall', h1: 'Page Not Found', sub: 'The page you\'re looking for has wandered off. It may have moved or been removed.', home: 'Go Home', notice: 'View Notice' },
    };

    function apply(lang) {
      const c = titles[lang] || titles['zh-CN'];
      document.title = c.title;
      document.getElementById('nftTitle').textContent = c.h1;
      document.getElementById('nftSub').textContent = c.sub;
      document.getElementById('nftHome').textContent = c.home;
      document.getElementById('nftNotice').textContent = c.notice;
    }

    const lang = localStorage.getItem('lc_lang') || 'zh-CN';
    apply(lang);
    window.addEventListener('lc:langchange', e => apply(e.detail?.lang || 'zh-CN'));
  </script>

  <style>
    /* 404 专用样式（不依赖 class 名，避免跟 style.css 冲突） */
    .page-404 {
      min-height: calc(100vh - 64px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
      position: relative;
      z-index: 1;
    }
    .not-found-wrap {
      text-align: center;
      max-width: 560px;
    }
    /* 像素风格大 404 数字 */
    .not-found-pixel {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
      margin-bottom: 24px;
    }
    .pixel-digit {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(48px, 12vw, 96px);
      color: var(--c-red, #c00);
      text-shadow: 3px 3px 0 var(--c-border, #2a2a2a),
                   6px 6px 0 rgba(0,0,0,.25);
      line-height: 1;
      letter-spacing: -2px;
    }
    .pixel-0 { color: var(--c-blue, #369); }
    /* 标题 */
    .not-found-title {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(16px, 4vw, 24px);
      color: var(--c-text, #1a1a1a);
      margin: 0 0 16px;
      line-height: 1.4;
    }
    .not-found-sub {
      font-family: 'VT323', monospace;
      font-size: clamp(18px, 3vw, 24px);
      color: var(--c-stone-dark, #5a5a6a);
      margin: 0 0 32px;
      line-height: 1.5;
    }
    /* 按钮组 */
    .not-found-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }
    .btn-lg {
      padding: 12px 28px;
      font-size: 16px;
      border-radius: 0;
      border: 3px solid var(--c-border, #2a2a2a);
      box-shadow: 4px 4px 0 var(--c-border, #2a2a2a);
      transition: transform .1s, box-shadow .1s;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      font-family: inherit;
    }
    .btn-lg:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 var(--c-border, #2a2a2a);
    }
    .btn-lg:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--c-border, #2a2a2a);
    }
    .btn-primary {
      background: var(--c-red, #c0392b);
      color: #fff;
      border-color: var(--c-border, #2a2a2a);
    }
    .btn-ghost {
      background: transparent;
      color: var(--c-text, #1a1a1a);
    }
    /* 像素小路装饰 */
    .not-found-path {
      display: flex;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .path-tile {
      width: 32px;
      height: 16px;
      background: var(--c-gold, #c9a84c);
      border: 2px solid var(--c-border, #2a2a2a);
      border-radius: 2px;
    }
  </style>
</body>
</html>

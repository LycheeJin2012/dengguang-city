<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>玩家主页 · 灯光市</title>
<link rel="preload" href="css/style.css?v=20260828-apple-motion" as="style" />
<link rel="preload" href="css/subpages.css" as="style" />
<link rel="preload" href="js/profile.js" as="script" />
<link rel="stylesheet" href="css/style.css?v=20260828-apple-motion">
<link rel="stylesheet" href="css/subpages.css">
</head>
<body>

<header class="navbar" id="navbar">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">
      <div class="logo-block" aria-hidden="true">
        <div class="block-grass"></div>
        <div class="block-dirt"></div>
      </div>
      <div class="logo-text">
        <span class="logo-zh">灯光市人民政府</span>
        <span class="logo-en">LIGHT CITY GOVERNMENT</span>
      </div>
    </a>
    <span class="nav-user-slot" id="navUserSlot"></span>
  </div>
</header>

<div class="page-back-row">
  <a href="index.html">← 返回首页</a>
</div>

<div class="profile-wrap" id="app">
  <div class="profile-card">
    <div class="profile-banner"></div>
    <div class="profile-avatar" id="pAvatar">👤</div>
    <div class="profile-body" id="pBody">
      <div class="profile-loading">载入中…</div>
    </div>
  </div>

  <!-- v37.7: 我最近的市民留言 (仅登录玩家) -->
  <div class="profile-card my-messages-card" id="myMessagesCard" style="display:none">
    <!-- JS 渲染 -->
  </div>

  <!-- v40: 我最近的报名 (酒店/驾照/赛道/赛车场 4 端点并发拉) -->
  <div class="profile-card my-bookings-card" id="myBookingsCard" style="display:none">
    <!-- JS 渲染 -->
  </div>

  <!-- 账号安全 / 通行密钥管理（仅本人可见） -->
  <div class="profile-card passkey-card" id="passkeyCard" style="display:none">
    <div class="passkey-head">🔑 账号安全 · 通行密钥 (Passkey)</div>
    <div class="passkey-body">
      <p class="passkey-desc">
        通行密钥用 Touch ID / Face ID / Windows Hello 登录，<b>无需输密码</b>，抗钓鱼。
      </p>
      <div id="passkeyList" class="passkey-list"></div>
      <button id="addPasskeyBtn" type="button" class="passkey-add-btn">
        ➕ 添加通行密钥
      </button>
      <p id="passkeyMsg" class="passkey-msg muted"></p>
    </div>
  </div>
</div>

<script>
  // v35: 先加载 toast.js, 后加载 profile.js
  (function(){
    var t = document.createElement('script');
    t.src = 'js/toast.js?v=20260826-toast';
    t.defer = true;
    document.currentScript.parentNode.insertBefore(t, document.currentScript);
    var s = document.createElement('script');
    s.src = 'js/profile.js?v=20260828-my-bookings';
    s.defer = true;
    document.currentScript.parentNode.insertBefore(s, document.currentScript);
  })();
</script>
</body>
</html>

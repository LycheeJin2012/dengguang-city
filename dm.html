<!-- 登录 Modal -->
<div class="modal-mask" id="loginMask" style="display:none">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
    <button class="modal-close" id="loginClose" aria-label="关闭">×</button>
    <h3 id="loginTitle" class="modal-text-center modal-title-center">玩家登录</h3>
    <p class="modal-msg-inline" id="loginMsg">登录后可发留言、订酒店、报名赛车</p>
    <form id="loginForm" class="modal-form">
      <label><span>账号</span><input type="text" id="loginUsername" required autocomplete="username" /></label>
      <label id="loginEmailRow" style="display:none"><span>邮箱（注册用）</span><input type="email" id="loginEmail" autocomplete="email" /></label>
      <label id="loginPasswordRow"><span>密码</span><input type="password" id="loginPassword" autocomplete="current-password" /></label>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="loginModeLogin">已有账号</button>
        <button type="button" class="btn btn-ghost" id="loginModeRegister">注册新号</button>
        <button type="submit" class="btn btn-primary" id="loginSubmit">登录</button>
      </div>
    </form>
    <p class="login-back-home">管理员请去 <a href="admin.html">/admin.html</a> 登录</p>
  </div>
</div>
